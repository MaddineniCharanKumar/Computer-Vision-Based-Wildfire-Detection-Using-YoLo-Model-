[project]
name = "forestguard"
version = "2.0.0"
description = "Wildfire and smoke detection with YOLO and an evidence-first dashboard"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic-settings>=2.2", "python-multipart>=0.0.9", "Pillow>=10.0", "PyYAML>=6.0"]
[project.optional-dependencies]
ml = ["ultralytics>=8.3", "torch>=2.2", "opencv-python>=4.9"]
dev = ["pytest>=8", "ruff>=0.5"]
[tool.setuptools.packages.find]
include = ["fireguard*", "training*", "utils*"]
