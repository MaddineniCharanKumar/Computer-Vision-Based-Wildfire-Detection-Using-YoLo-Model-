version: '3.9'
services:
  api:
    build: .
    command: uvicorn fireguard.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      FIREGUARD_DEMO_MODE: 'true'
      DATABASE_URL: sqlite:///./fireguard.db

  dashboard:
    build: ./dashboard
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
